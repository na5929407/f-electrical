
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F Electrical</title>
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#222;color:#fff;padding:20px;text-align:center}
section{padding:20px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.card{background:#fff;padding:10px;border-radius:10px}
img{width:100%;border-radius:8px}
footer{background:#222;color:#fff;text-align:center;padding:10px}
</style>
</head>
<body>
<header>
<h1>F Electrical</h1>
<p>รับติดตั้ง ซ่อมบำรุง และรีโนเวทระบบไฟฟ้า</p>
<p>โทร: 094-704-9295 | Facebook: Nattawut Ef</p>
</header>

<section>
<h2>ผลงาน</h2>
<div id="gallery" class="gallery"></div>
</section>

<footer>© F Electrical</footer>

<script>
const works = JSON.parse(localStorage.getItem("works") || "[]");
const gallery = document.getElementById("gallery");
works.forEach(w=>{
 gallery.innerHTML += `
 <div class="card">
   <h3>${w.category}</h3>
   <img src="${w.image}">
   <p>${w.title}</p>
 </div>`;
});
</script>
</body>
</html>
